];
const CATS = {
  water:{c:"var(--water-deep)",dot:"var(--water)",lab:"WATER"},
  eat:{c:"var(--sage)",dot:"var(--sage)",lab:"ANTI-INFLAMMATORY MEAL"},
  snack:{c:"var(--sun)",dot:"var(--sun)",lab:"SMART SNACK"},
  train:{c:"var(--berry)",dot:"var(--berry)",lab:"TRAIN · THIN MUSCLE"},
  recharge:{c:"var(--lav)",dot:"var(--lav)",lab:"RECHARGE"},
  night:{c:"#7A8A94",dot:"#7A8A94",lab:"WIND DOWN"}
};
const KEY="energy_v1";
let DAY = Math.floor(new Date(new Date().toLocaleDateString("en-CA")).getTime()/864e5);
let LOG = {};
try{ LOG = JSON.parse(localStorage.getItem(KEY+":"+DAY)||"{}")||{}; }catch(e){}
const PRIME = {breakfast:3, lunch:7, dinner:3, snackA:2, snackB:3, train:3, morning:5, recharge:2, night:1, quest:7, hero:5};
const SHIFT = {breakfast:0, lunch:2, dinner:5, snackA:1, snackB:4, train:0, morning:3, recharge:2, night:5, quest:6, hero:1};
const off = (slot)=>(DAY*PRIME[slot]+SHIFT[slot])%POOL[slot].length;
function save(){ localStorage.setItem(KEY+":"+DAY, JSON.stringify(LOG)); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
const CF=["#7FB5D5","#C96A8B","#F2C94C","#8FAE8B","#FFFFFF"];
function burst(x,y,n){ for(let k=0;k<n;k++){ const p=document.createElement("div"); p.className="cf";
  const s=4+Math.random()*5, c=CF[Math.floor(Math.random()*CF.length)];
  p.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c}`;
  const tx=(Math.random()-.5)*220, ty=-Math.random()*180-30, r=(Math.random()-.5)*500;
  document.body.appendChild(p);
  p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${tx}px,${ty}px) rotate(${r}deg)`,opacity:0}],{duration:600+Math.random()*400,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>p.remove(); } }
function rowHTML(id, tm, catKey, title, note, isFix){
  const C = CATS[catKey], done = !!LOG[id];
  return `<div class="row ${done?"done":""}" id="${id}" style="--dot:${C.dot}">
    <div class="tm">${tm}</div><div class="rail"></div>
    <div class="body"><div class="cat" style="color:${C.c}">${C.lab}${isFix?'<span class="fix">固定</span>':""}</div>
    <div class="txt">${title}</div>${note?`<div class="note">${note}</div>`:""}</div>
    <div class="tick"><svg viewBox="0 0 24 24"><polyline points="4 12.5 10 18.5 20 6"/></svg></div></div>`;
}
function render(){
  const now = new Date();
  const wd = "日一二三四五六"[now.getDay()];
  const doy = Math.floor((now - new Date(now.getFullYear(),0,0))/864e5);
  document.getElementById("hero").textContent = "「"+POOL.hero[off("hero")]+"」";
  document.getElementById("dline").innerHTML =
    `<b>${now.getMonth()+1} 月 ${now.getDate()} 日 · 星期${wd}</b> · 一年的第 ${doy} 天 · GLOW DAY NO.${DAY}`;
  document.getElementById("sub").innerHTML =
    `她是那种<span class="h">喝大水、吃抗炎饮食、一身薄肌</span>的女孩——今天的时间轴已就位：三餐和训练每天换新，温水和早睡永远是老规矩。<b>过了 0 点自动翻页。</b>`;
  const q = POOL.quest[off("quest")];
  document.getElementById("chTxt").textContent = q.t + " —— " + q.n;
  const cups = document.getElementById("cups");
  cups.innerHTML = WATER.map((w,i)=>`<div class="cup ${LOG["w"+i]?"on":""}" data-i="${i}" title="${w.tm} · ${w.ml}ml"><i></i></div>`).join("");
  const total = WATER.reduce((s,w,i)=>s+(LOG["w"+i]?w.ml:0),0);
  document.getElementById("hyN").textContent = total+" / "+WATER.reduce((s,w)=>s+w.ml,0)+" ml";
  const b = POOL.breakfast[off("breakfast")], l = POOL.lunch[off("lunch")], dn = POOL.dinner[off("dinner")];
  const sa = POOL.snackA[off("snackA")], sb = POOL.snackB[off("snackB")];
  const tr = POOL.train[off("train")], mo = POOL.morning[off("morning")], rc = POOL.recharge[off("recharge")], ni = POOL.night[off("night")];
  const rows = [
    ["wake","07:00","water","起床 · 温水 350ml","昨夜失水先还上，肠胃被轻轻叫醒",true],
    ["m1","07:20","recharge","晨间仪式 · "+mo.t,mo.n,false],
    ["b1","08:00","eat","早餐 · "+b.t,b.n,false],
    ["focus","09:30","recharge","专注时段 ①（90 分钟深工作）","最难的脑力活在上午干，接水当休息",true],
    ["sa","11:15","snack","上午加餐 · "+sa.t,sa.n,false],
    ["w11","11:30","water","午餐前 300ml","饭前水的仪式感：胃知道饭要来了",true],
    ["l1","13:00","eat","午餐 · "+l.t,l.n,false],
    ["rc","14:30","recharge","午后充电 · "+rc.t,rc.n,false],
    ["sb","16:30","snack","下午加餐 · "+sb.t,sb.n,false],
    ["tr","17:30","train","训练 · "+tr.t,tr.n,false],
    ["w19","19:00","water","训练后补水 400ml","电解质可选：出汗多就加一小撮盐",true],
    ["dn","19:30","eat","晚餐 · "+dn.t,dn.n,false],
    ["ni","21:00","night","晚间仪式 · "+ni.t,ni.n,false],
    ["cut","21:30","water","今日饮水收口","睡前 2 小时停大水，明早的脸不肿",true],
    ["sk","22:45","night","护肤 + 调暗灯光","暖光只留一盏，褪黑素开始排班",true],
    ["sl","23:15","night","关灯 · 睡满 7.5 小时","睡眠是最强的天然抗炎药，没有之一",true]
  ];
  document.getElementById("rows").innerHTML = rows.map(r=>rowHTML(...r)).join("");
  document.getElementById("rows").querySelectorAll(".row").forEach(el=>{
    el.addEventListener("click",()=>{
      const id = el.id; LOG[id] = !LOG[id];
      if(LOG[id]){ const r=el.getBoundingClientRect(); burst(r.left+60,r.top+16,10); }
      else { delete LOG[id]; }
      save(); render();
    });
  });
  document.getElementById("tlMeta").textContent = "TIMELINE /// " + rows.length + " BLOCKS";
}
document.getElementById("cups").addEventListener("click",e=>{
  const c = e.target.closest(".cup"); if(!c) return;
  const i = +c.dataset.i; LOG["w"+i] = !LOG["w"+i];
  if(LOG["w"+i]){ const r=c.getBoundingClientRect(); burst(r.left+17,r.top+10,8); }
  save(); render();
  const total = WATER.reduce((s,w,i)=>s+(LOG["w"+i]?w.ml:0),0);
  if(total >= WATER.reduce((s,w)=>s+w.ml,0)) toast("大水女孩认证 /// 喝满一整天");
});
render();
let curDay = DAY;
setInterval(()=>{
  const d = Math.floor(new Date(new Date().toLocaleDateString("en-CA")).getTime()/864e5);
  if(d !== curDay){ curDay = d; DAY = d; LOG = {}; render(); toast("新的一天已翻页 /// 先喝温水"); }
}, 30000);
</script>
</body>
</html>
